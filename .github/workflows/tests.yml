# Unit tests only. Does not download D4RL files and does not train.
# Tests marked needs_offline_data load the gitignored hdf5 files under data/raw
# and are excluded here.

name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Headless MuJoCo libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglfw3 libgl1 libglib2.0-0 xvfb

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Reproducibility check
        env:
          # glfw plus Xvfb. egl is not available on this headless runner.
          # The Makefile also defaults MUJOCO_GL to glfw.
          MUJOCO_GL: glfw
        run: xvfb-run -a make check

  latex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/xu-cheng/texlive-small:20261001
    steps:
      - uses: actions/checkout@v4

      - name: Add the packages scheme-small does not ship
        run: timeout 4m tlmgr install algorithms eso-pic multirow

      - name: Build the manuscript
        working-directory: research_paper/iclr2027
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error iclr2027_conference.tex
          bibtex iclr2027_conference
          pdflatex -interaction=nonstopmode -halt-on-error iclr2027_conference.tex
          pdflatex -interaction=nonstopmode -halt-on-error iclr2027_conference.tex
          if grep -E "undefined references|Citation .* undefined|^!" iclr2027_conference.log; then
            echo "LaTeX log still reports an unresolved reference or an error."
            exit 1
          fi
