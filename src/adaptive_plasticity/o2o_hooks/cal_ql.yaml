# Cal-QL is not vendored. This hook records how a wrapper would call CapacityGate.
# Status stays not_yet_run until the JAX/Flax learner is wrapped. No scores.
learner: cal_ql
status: not_yet_run
operator: shrink_perturb
dorm_on: 0.15
dorm_off: 0.08
rho_on: 0.70
rho_off: 0.85
cooldown_steps: 3000
active_severity: 0.1
editable_components: [critic, policy]
frozen_components: []
notes: >
  Upstream is https://github.com/nakamotoo/Cal-QL (JAX/Flax, AntMaze and Adroit).
  Keep the calibration term. The gate only decides whether an intervention runs.
