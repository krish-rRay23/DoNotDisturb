# Probe-distribution ablation. Not yet run.
# Published CapacityGate monitors online_buffer. offline_fixed and
# recent_window are the comparison sources. The rank anchor stays on the
# frozen offline probe inside the runner; only the monitoring batch changes.
name: probe_distributions
description: >
  Compare capacity probes drawn from the frozen offline buffer, the full
  online buffer, and a recent online window. No scores have been produced.
status: not_yet_run
defaults:
  datasets:
    - halfcheetah-medium-v2
    - hopper-medium-v2
    - walker2d-medium-v2
  seeds: [0, 1, 2, 3, 4]
  controller: capacity_gate
  shift: none
  severity: 0.0
  shift_step: 5000
  online_steps: 25000
  warmup_updates: 25000
  online_ratio: 0.5
  gate_interval: 1000
  eval_interval: 2500
  eval_episodes: 10
  probe_size: 256
  recent_window: 1024
  gate_operator: shrink_perturb
  rho_on: 0.70
  rho_off: 0.85
  dorm_on: 0.15
  dorm_off: 0.08
  cooldown_steps: 3000
  active_severity: 0.1
cells:
  - id: offline_fixed
    probe_source: offline_fixed
    include_in_pilot: true
    pilot_datasets: [hopper-medium-v2]
    notes: Frozen offline observations on every evaluation.
  - id: online_buffer
    probe_source: online_buffer
    include_in_pilot: false
    notes: Published CapacityGate probe. Included so the other sources have a matched reference cell.
  - id: recent_window_1024
    probe_source: recent_window
    recent_window: 1024
    include_in_pilot: true
    pilot_datasets: [hopper-medium-v2]
    notes: Most recent 1024 online transitions.
  - id: recent_window_256
    probe_source: recent_window
    recent_window: 256
    include_in_pilot: true
    pilot_datasets: [hopper-medium-v2]
    notes: Most recent 256 online transitions.
