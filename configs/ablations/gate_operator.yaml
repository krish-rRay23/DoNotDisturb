# Operator under the gate. Published CapacityGate applies shrink-and-perturb
# when the gate opens. redo is the alternate operator. ReDo here is the
# approximate, low-disruption reset implemented in interventions.py
# (relative threshold, outgoing weights zeroed). Not yet run.
name: gate_operator
description: >
  Choose the operator CapacityGate applies on hopper-medium-v2 when the gate
  opens. Thresholds, cooldown, and the online-buffer probe stay at the
  published values. Not yet run.
status: not_yet_run
defaults:
  datasets: [hopper-medium-v2]
  seeds: [0, 1, 2, 3, 4]
  controller: capacity_gate
  shift: none
  severity: 0.0
  shift_step: 5000
  online_steps: 25000
  warmup_updates: 25000
  online_ratio: 0.5
  gate_interval: 1000
  eval_interval: 2500
  eval_episodes: 10
  probe_source: online_buffer
  probe_size: 256
  recent_window: 1024
  gate_operator: shrink_perturb
  rho_on: 0.70
  rho_off: 0.85
  dorm_on: 0.15
  dorm_off: 0.08
  cooldown_steps: 3000
  active_severity: 0.1
cells:
  - id: shrink_perturb
    gate_operator: shrink_perturb
    include_in_pilot: false
    notes: Published operator under the gate.
  - id: redo
    gate_operator: redo
    include_in_pilot: true
    notes: Approximate, low-disruption ReDo reset under the same gate.
