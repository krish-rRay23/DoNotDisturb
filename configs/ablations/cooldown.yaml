# Refractory-cooldown ablation. Published value is 3000 online steps.
# Not yet run.
name: cooldown
description: >
  Sweep CapacityGate cooldown on hopper-medium-v2 with published thresholds,
  the online-buffer probe, and shrink-and-perturb. Not yet run.
status: not_yet_run
defaults:
  datasets: [hopper-medium-v2]
  seeds: [0, 1, 2, 3, 4]
  controller: capacity_gate
  shift: none
  severity: 0.0
  shift_step: 5000
  online_steps: 25000
  warmup_updates: 25000
  online_ratio: 0.5
  gate_interval: 1000
  eval_interval: 2500
  eval_episodes: 10
  probe_source: online_buffer
  probe_size: 256
  recent_window: 1024
  gate_operator: shrink_perturb
  rho_on: 0.70
  rho_off: 0.85
  dorm_on: 0.15
  dorm_off: 0.08
  cooldown_steps: 3000
  active_severity: 0.1
cells:
  - id: cooldown_0
    cooldown_steps: 0
    include_in_pilot: true
    notes: No refractory period.
  - id: cooldown_1000
    cooldown_steps: 1000
    include_in_pilot: false
    notes: One gate interval between interventions.
  - id: cooldown_3000
    cooldown_steps: 3000
    include_in_pilot: false
    notes: Published cooldown.
  - id: cooldown_10000
    cooldown_steps: 10000
    include_in_pilot: false
    notes: Long refractory period.
